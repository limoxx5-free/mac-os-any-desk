name: macOS Remote Desktop (VNC via Cloudflare Tunnel)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'How long the desktop stays active (hours, max 6)'
        required: false
        default: '6'
      vnc_password:
        description: 'VNC password (only the first 8 characters are used). Prefer the VNC_PASSWORD repo secret — input values are visible in the run page.'
        required: false
        default: ''
      vnc_hostname:
        description: 'Public hostname configured in the Cloudflare tunnel (e.g. vnc.example.com). Only used to print the client command.'
        required: false
        default: ''

jobs:
  macos-remote-desktop:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Validate inputs
        env:
          INPUT_VNC_PASSWORD: ${{ github.event.inputs.vnc_password || secrets.VNC_PASSWORD }}
          INPUT_VNC_HOST: ${{ github.event.inputs.vnc_hostname }}
        run: |
          DURATION="${{ github.event.inputs.duration }}"
          if [ -z "$DURATION" ]; then
            DURATION=6
          fi
          INT_DURATION=$(echo "$DURATION" | awk '{print int($1)}')
          if [ "$INT_DURATION" -gt 6 ]; then
            INT_DURATION=6
          fi
          if [ "$INT_DURATION" -lt 1 ]; then
            INT_DURATION=1
          fi
          echo "RUN_DURATION_HOURS=$INT_DURATION" >> "$GITHUB_ENV"
          echo "Desktop will stay active for $INT_DURATION hour(s) (max 6)."

          # The legacy VNC protocol authenticates with at most 8 characters
          echo "::add-mask::$INPUT_VNC_PASSWORD"
          if [ -z "$INPUT_VNC_PASSWORD" ]; then
            echo "::error::No VNC password provided. Set the vnc_password input or the VNC_PASSWORD repository secret."
            exit 1
          fi
          VNC_PW="${INPUT_VNC_PASSWORD:0:8}"
          if [ "$VNC_PW" != "$INPUT_VNC_PASSWORD" ]; then
            echo "Note: VNC only uses the first 8 characters of the password."
          fi
          printf 'VNC_PASSWORD_8=%s\n' "$VNC_PW" >> "$GITHUB_ENV"
          printf 'VNC_HOST=%s\n' "$INPUT_VNC_HOST" >> "$GITHUB_ENV"

          # Job start timestamp: the keepalive step needs it to stop before the 360 min hard limit
          date +%s > /tmp/job_start.txt

      - name: Enable Screen Sharing (ARD) and set VNC password
        run: |
          # Apple Remote Desktop is a system daemon: there is no accept/deny dialog,
          # sessions are authorized with the VNC password only. Nothing to click on the runner.
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          RUNNER_USER="$(whoami)"

          sudo "$KICKSTART" -activate \
            -configure -access -on -users "$RUNNER_USER" -privs -all \
            -restart -agent
          echo "Remote Management activated for user $RUNNER_USER."

          # Enable legacy VNC so any VNC client can connect (Screen Sharing, RealVNC, TigerVNC...)
          sudo "$KICKSTART" -configure -clientopts \
            -setvncpw -vncpw "$VNC_PASSWORD_8" \
            -setvnclegacy -vnclegacy yes \
            -restart -agent
          echo "VNC password set (8 chars max)."

          # Fail fast if nothing is listening instead of burning the whole session
          for i in $(seq 1 15); do
            if nc -z 127.0.0.1 5900 2>/dev/null; then
              echo "Screen Sharing is listening on 127.0.0.1:5900."
              break
            fi
            sleep 2
          done
          if ! nc -z 127.0.0.1 5900 2>/dev/null; then
            echo "::error::Port 5900 is not listening after enabling Screen Sharing — aborting instead of keeping the runner alive for nothing."
            lsof -nP -iTCP:5900 || true
            exit 1
          fi

      - name: Install cloudflared
        run: |
          brew install cloudflared
          cloudflared --version

      - name: Start Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -n "$TUNNEL_TOKEN" ]; then
            echo "::add-mask::$TUNNEL_TOKEN"
            # Named tunnel: the hostname → tcp://localhost:5900 mapping is configured
            # in the Cloudflare Zero Trust dashboard, not in this command.
            nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
            echo "TUNNEL_MODE=named" >> "$GITHUB_ENV"
          else
            echo "::warning::CLOUDFLARE_TUNNEL_TOKEN is not set: falling back to a quick tunnel (random trycloudflare.com address, visible in the public run logs). Set the secret for a stable, private hostname."
            nohup cloudflared tunnel --no-autoupdate --url tcp://localhost:5900 > /tmp/cloudflared.log 2>&1 &
            echo "TUNNEL_MODE=quick" >> "$GITHUB_ENV"
          fi
          sleep 15

          if ! pgrep -f "cloudflared" > /dev/null 2>&1; then
            echo "::error::cloudflared exited immediately — check the tunnel token and the hostname configuration."
            cat /tmp/cloudflared.log
            exit 1
          fi

          # Quick tunnels print their address to the log; named tunnels keep the dashboard hostname
          QUICK_ADDR=$(grep -oE 'tcp://[a-z0-9-]+\.trycloudflare\.com(:[0-9]+)?' /tmp/cloudflared.log | head -1 || true)
          if [ -n "$QUICK_ADDR" ]; then
            echo "QUICK_ADDR=$QUICK_ADDR" >> "$GITHUB_ENV"
            echo "Quick tunnel address: $QUICK_ADDR"
          fi
          tail -20 /tmp/cloudflared.log

      - name: Connection instructions
        run: |
          {
            echo "## Remote Desktop — macOS Screen Sharing via Cloudflare"
            echo ""
            if [ "$TUNNEL_MODE" = "named" ] && [ -n "$VNC_HOST" ]; then
              echo "**1)** Sul tuo computer (installa cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/):"
              echo '```'
              echo "cloudflared access tcp --hostname $VNC_HOST --url localhost:5900"
              echo '```'
              echo ""
              echo "**2)** Apri Condivisione schermo (Finder → Vai → Connetti al server, oppure ⌘K) e connettiti a:"
              echo '```'
              echo "vnc://localhost:5900"
              echo '```'
              echo ""
              echo "**3)** Password VNC: la VNC_PASSWORD che hai configurato (prime 8 lettere)."
            elif [ "$TUNNEL_MODE" = "named" ]; then
              echo "Tunnel avviato. Sul tuo computer esegui:"
              echo '```'
              echo "cloudflared access tcp --hostname <il tuo hostname configurato nel tunnel> --url localhost:5900"
              echo '```'
              echo "Poi apri vnc://localhost:5900 con la password VNC."
            else
              echo "Quick tunnel: connettiti direttamente a \`${QUICK_ADDR:-vedi i log)}\` con un qualsiasi client VNC."
            fi
            echo ""
            echo "**Durata massima:** $RUN_DURATION_HOURS ora/e"
            echo ""
            echo "Nessuna accettazione richiesta lato runner: ARD autorizza con la sola password VNC."
            echo "Sicurezza: la password VNC è limitata a 8 caratteri dal protocollo; con una named tunnel protetta da Cloudflare Access il tunnel è privato."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep desktop alive for the configured duration
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          relaunch_tunnel() {
            if [ -n "$TUNNEL_TOKEN" ]; then
              nohup cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/cloudflared.log 2>&1 &
            else
              nohup cloudflared tunnel --no-autoupdate --url tcp://localhost:5900 > /tmp/cloudflared.log 2>&1 &
            fi
          }

          if ! pgrep -f "cloudflared" > /dev/null 2>&1; then
            echo "cloudflared not running, relaunching..."
            relaunch_tunnel
            sleep 10
          fi

          # GitHub hard-kills the job at 360 min, so never loop past job start + 350 min
          JOB_START=$(cat /tmp/job_start.txt 2>/dev/null || date +%s)
          DESIRED_END=$((JOB_START + RUN_DURATION_HOURS * 3600))
          HARD_END=$((JOB_START + 350 * 60))
          if [ "$DESIRED_END" -lt "$HARD_END" ]; then
            END=$DESIRED_END
          else
            END=$HARD_END
          fi
          echo "Keeping session alive until $(date -r "$END" '+%Y-%m-%d %H:%M:%S')..."

          while [ "$(date +%s)" -lt "$END" ]; do
            if ! pgrep -f "cloudflared" > /dev/null 2>&1; then
              echo "cloudflared crashed, relaunching..."
              relaunch_tunnel
            fi
            if ! nc -z 127.0.0.1 5900 2>/dev/null; then
              echo "Screen Sharing not listening, re-arming ARD..."
              sudo "$KICKSTART" -activate -configure -access -on -users "$(whoami)" -privs -all -restart -agent
            fi
            sleep 60
          done
          echo "Time's up. Shutting down."
